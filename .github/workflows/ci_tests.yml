# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI_tests

on:
  pull_request:


permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-environment: py310
          - python-version: "3.12"
            tox-environment: py312
          - python-version: "3.13"
            tox-environment: py313

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system packages
      run: |
          sudo apt update
          sudo apt install libudunits2-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.tox-environment }}

  minimal-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create virtual env
        run: python3 -m venv venv --upgrade-deps
      - name: Install pyaro
        run: source venv/bin/activate && pip install ./
      - name: Try importing pyaro
        run: source venv/bin/activate && python -c "import pyaro; print(pyaro.__version__)"
